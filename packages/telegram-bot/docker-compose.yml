version: "3.8"

services:
  omp-telegram-bot:
    build:
      context: ../..
      dockerfile: packages/telegram-bot/Dockerfile
    container_name: omp-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OMP_MODEL=${OMP_MODEL:-google-antigravity/gemini-3.7-flash}
      - OMP_AUTO_APPROVE=${OMP_AUTO_APPROVE:-yolo}
      - ALLOWED_TELEGRAM_USERS=${ALLOWED_TELEGRAM_USERS:-*}
    volumes:
      - omp_sessions:/root/.omp/telegram-sessions
      - omp_workspaces:/root/.omp/telegram-workspaces

volumes:
  omp_sessions:
  omp_workspaces:
